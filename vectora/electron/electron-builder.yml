# electron-builder config — Bloco T.12.6
#
# Gera instaladores nativos assinados (Win .msi/.exe, macOS .dmg notarized,
# Linux .AppImage/.deb/.rpm). Cada instalador empacota a shell Electron
# + o binário Nuitka como extraResource (T.12.4).
#
# Pre-req:
# - Win: CSC_LINK + CSC_KEY_PASSWORD (cert EV Azure Trusted Signing).
# - macOS: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID.
# - Linux: nada (não assinamos AppImage).
#
# Publish: update-server (Cloudflare Worker + R2), não GitHub Releases — o
# repo é privado (Vectora é vendido, não open source) e o Free precisa baixar
# e atualizar sem conta. `${os}`/`${arch}` resolvem por build (mesmo macro do
# artifactName), então cada instalador aponta pro seu próprio
# /updates/latest/<os>/<arch>/latest.yml no worker (update-server/src/worker.ts).

appId: company.vectora.desktop
productName: Vectora
copyright: Copyright © 2026 Vectora Company
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# Toolset moderno de assinatura (electron-builder 26). O default (legacy/null)
# baixa o pacote monolítico `winCodeSign-2.6.0.7z`, que carrega symlinks de
# `darwin/.../*.dylib` (OpenSSL do macOS). No Windows sem Modo de Desenvolvedor
# nem admin, o 7za falha ao criar esses symlinks (`Cannot create symbolic link`)
# e o build inteiro aborta — mesmo num build NÃO-assinado. O toolset "1.1.0" usa
# bundles `.zip` modulares (windows-kits-bundle + rcedit-windows), todos só com
# binários Windows, sem nenhum symlink — extrai limpo sem privilégio especial.
toolsets:
  winCodeSign: "1.1.0"

# Esquema de deep-link vectora:// — antes vivia em package.json["build"], que o
# electron-builder IGNORA quando existe este .yml (config único). Movido p/ cá.
protocols:
  - name: Vectora
    schemes:
      - vectora

directories:
  output: dist-electron
  buildResources: build-resources

files:
  - dist/**/*
  - package.json
  - "!node_modules/**/{CHANGELOG.md,README.md,*.d.ts,test,tests}"

# Backend híbrido (PyInstaller --onedir) como sidecar. build-hybrid.py Fase 2 gera
# a PASTA dist/vectora/ (vectora.exe + _internal/); copiamos ela inteira para
# resources/vectora-core/. onedir (sem compressão) é o que habilita o delta do
# electron-updater: arquivos não-alterados ficam byte-idênticos entre versões.
# O app spawna resources/vectora-core/vectora.exe (electron/src/main.ts).
extraResources:
  - from: ../../dist/vectora
    to: vectora-core
  - from: ../frontend/public/favicon-32x32.png
    to: tray-icon.png
  - from: ../frontend/public/vectora.ico
    to: vectora.ico

# Janela de update aponta pro update-server público (sem token — Free não
# tem conta). ${os}/${arch} resolvem por build, batendo com a rota
# GET /updates/:channel/:os/:arch/latest.yml do worker.
publish:
  - provider: generic
    url: https://update.vectora.company/updates/latest/${os}/${arch}
    channel: latest

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: msi
      arch: [x64]
  icon: ../frontend/public/vectora.ico
  # Sem opções de assinatura fixas: o electron-builder assina automaticamente
  # quando CSC_LINK + CSC_KEY_PASSWORD estão no env (CI, cert EV em base64) e
  # gera build NÃO-assinado quando não estão (dev local). Fixar
  # certificateSubjectName forçava procurar o cert no Windows store e quebrava
  # o build local ("Cannot find certificate Vectora Company").

mac:
  target:
    - target: dmg
      arch: [arm64]
  # electron-builder gera o .icns a partir de um .svg/.png — .ico não é
  # aceito nesse pipeline (icon-tool.js só lê .png/.svg/.icns).
  icon: ../frontend/public/vectora.svg
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true

dmg:
  title: ${productName} ${version}
  # background omitido de propósito — usa o fundo padrão do electron-builder
  # (não há dmg-background.png em build-resources; sem isso o build falharia).
  iconSize: 96
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
  icon: ../frontend/public/favicon-600x600.png
  category: Development
  # electron-builder 26: as chaves do .desktop ficam sob `desktop.entry`
  # (antes eram soltas em `desktop`).
  desktop:
    entry:
      StartupWMClass: vectora
      Categories: Development;IDE;
  synopsis: Vectora — AI-first development assistant
  description: Self-hosted AI assistant with RAG, terminals, code editing and workflows.
  vendor: Vectora Company
  maintainer: Bruno Soares <bruno@vectora.company>

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libdrm2
    - libgbm1
  priority: optional
  afterInstall: build-resources/linux-after-install.sh
  afterRemove: build-resources/linux-after-remove.sh

# Sem LICENSE no repo (produto proprietário, sem texto de licença definido
# ainda) — electron-builder falha o build do AppImage se `license:` apontar
# pra um arquivo inexistente. Reintroduzir aqui quando houver um EULA real.
appImage: {}

msi:
  # LGHT1105: ICE validation exige privilégio de admin ou política do SO específica.
  # -sw1105 suprime o aviso para que light.exe não falhe em builds locais/CI sem admin.
  additionalWixArgs:
    - "-sw1105"

nsis:
  # ManifestDPIAware true vem de build-resources/installer.nsh (hook customHeader,
  # auto-incluído pelo electron-builder) — sem ele a fonte do instalador borra em HiDPI.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: ../frontend/public/vectora.ico
  uninstallerIcon: ../frontend/public/vectora.ico
  shortcutName: Vectora
  uninstallDisplayName: Vectora
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: Vectora
  # Suporte a instalação silenciosa: vectora-Setup-x.y.z.exe /S

# Auto-update channel name (alpha / beta / latest).
generateUpdatesFilesForAllChannels: true

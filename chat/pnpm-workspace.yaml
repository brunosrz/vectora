allowBuilds:
  esbuild: true
  # sharp é puxado transitivamente (não importado em chat/src) e só tem build
  # script para compilar o binário nativo de imagem — o chat não precisa dele.
  # `false` = decisão explícita de NÃO rodar o build (limpa o
  # ERR_PNPM_IGNORED_BUILDS que quebrava o `pnpm install` no CI). Antes o valor
  # era o placeholder literal "set this to true or false", inválido para o pnpm.
  sharp: false

# Deprecação upstream aceita conscientemente: glob@11.1.0 é puxado
# transitivamente por workbox-build@7.4.1 (via vite-plugin-pwa) só em
# build-time para gerar o service worker. O mantenedor do glob deprecou
# todos os majors < 13, mas o glob 13 tem breaking changes que o
# workbox-build@7.x não suporta — forçar override quebraria a build da PWA.
# Silenciar aqui evita ruído sem mascarar dependência da aplicação.
allowedDeprecatedVersions:
  glob: "11.1.0"

# PyPI mirror — pacote "vectora-cli" somente-CLI.
#
# Este pyproject empacota apenas src/ + binding mínimo, sem chat/ (Next.js)
# nem desktop/ (Electron). Entry-point `vectora` chama o Launcher com
# VECTORA_CLI_ONLY=1, que recusa `vectora server *` e expõe apenas chat
# textual / rag / setup / config / traces / sessions / auth.
#
# Build local (manual, fora do CI principal):
#
#     uv build --package vectora-cli --out-dir dist/vectora-cli/
#
# Publish (GitHub Actions release-pypi job):
#
#     uv publish dist/vectora-cli/*

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectora-cli"
version = "0.1.0"
description = "Vectora CLI — textual chat, RAG and config (mirror do produto completo)"
readme = "README.md"
authors = [{ name = "Bruno Soares", email = "bruno@vectora.company" }]
license = { text = "Proprietary" }
requires-python = ">=3.13"
classifiers = [
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

# Subset mínimo de deps — sem fastapi/uvicorn/lancedb pesados.
# CLI mirror não roda servidor web nem vector store completo.
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langgraph>=1.2.1",
    "langchain-cohere>=0.5.1",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "rich>=15.0.0",
    "prompt-toolkit>=3.0.52",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "deepagents>=0.6.3",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.13.0",
]

[project.scripts]
vectora = "src.launcher:main"

[project.urls]
Homepage = "https://vectora.company"
Documentation = "https://docs.vectora.company"
"Source (private)" = "https://github.com/vectora-company/vectora"
"Full installer" = "https://vectora.company/download"

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude = [
    "src/api",                 # FastAPI server fica fora do CLI mirror
    "src/mcp",                 # MCP server idem
    "src/ui/textual",          # TUI textual fica fora (depende de textual)
    "**/__pycache__",
]

[tool.hatch.build.targets.sdist]
exclude = ["chat", "desktop", "tests/e2e", "build", "dist", "update-server"]

[tool.hatch.build.targets.wheel.force-include]
"src/defaults.env" = "src/defaults.env"

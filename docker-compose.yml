name: vectora

# Vectora MCP Server — Multi-Agent Hub (SSE/HTTP)
#
# Uso local (sem Traefik):
#   docker compose up -d
#   A API SSE fica disponível em http://localhost:8000/sse
#
# Uso em VPS com Traefik:
#   Defina VECTORA_DOMAIN no .env (ex: vectora.meudominio.com)
#   Certifique-se que a rede "traefik-public" já existe no host
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d

services:
  vectora:
    image: ghcr.io/brunosrz/vectora:latest
    restart: unless-stopped
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-vectora}
      - PYTHONUNBUFFERED=1
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=${MCP_PORT:-8000}
    volumes:
      - vectora-data:/root/.vectora
    ports:
      - "${MCP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  vectora-data:
    driver: local

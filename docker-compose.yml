name: vectora

# Vectora — Web Chat + API (FastAPI + Vite SPA)
#
# Uso local:
#   docker compose up -d
#   Acesse http://localhost:8080
#
# Uso em VPS com Traefik:
#   Defina VECTORA_DOMAIN no .env (ex: chat.meudominio.com)
#   Certifique-se que a rede "traefik-public" já existe no host
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d

services:
  vectora:
    image: ghcr.io/brunosrz/vectora:latest
    restart: unless-stopped
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - VECTORA_TOKEN=${VECTORA_TOKEN:-}
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=${PORT:-8080}
    volumes:
      - vectora-data:/root/.vectora
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  vectora-data:
    driver: local

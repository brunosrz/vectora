version: v2
plugins:
  # Python stubs (grpcio-tools) — BSR remote plugins
  - remote: buf.build/protocolbuffers/python
    out: ../gen
  - remote: buf.build/grpc/python
    out: ../gen
  # TypeScript (ES modules + ConnectRPC)
  - remote: buf.build/bufbuild/es
    out: ../../../chat/lib/gen
  - remote: buf.build/connectrpc/es
    out: ../../../chat/lib/gen
    opt: target=ts

syntax = "proto3";

// API de chat do Vectora — source of truth da interface de streaming.
//
// Geração de stubs: `make gen-proto` (requer buf CLI)
// Stubs Python: vectora/api/gen/  (build-time, não commitado)
// Stubs TS:     chat/frontend/lib/gen/ (build-time, não commitado)
//
// Em desenvolvimento o frontend consome a API via fetch nativo +
// vectora/api/schemas.py (equivalente Pydantic). Quando grpcio e buf
// estiverem disponíveis, `make gen-proto` gera os stubs compilados.

package vectora.chat.v1;

option go_package = "vectora/chat/v1";

// ── Serviços ──────────────────────────────────────────────────────────────

service ChatService {
  // Streaming de mensagens (server-streaming RPC).
  // Retorna uma sequência de StreamChatEvent via SSE / Connect streaming.
  rpc StreamChat(StreamChatRequest) returns (stream StreamChatEvent);

  // Retoma uma execução pausada por HITL (Human-in-the-Loop).
  rpc ResumeChat(ResumeChatRequest) returns (stream StreamChatEvent);

  // Retorna o schema das ferramentas disponíveis (autodescoberta pela UI).
  rpc GetTools(GetToolsRequest) returns (GetToolsResponse);
}

service ThreadService {
  rpc CreateThread(CreateThreadRequest) returns (Thread);
  rpc GetThread(GetThreadRequest)       returns (Thread);
  rpc ListThreads(ListThreadsRequest)   returns (ListThreadsResponse);
  rpc DeleteThread(DeleteThreadRequest) returns (DeleteThreadResponse);
  rpc GetHistory(GetHistoryRequest)     returns (GetHistoryResponse);
}

// ── Requests ──────────────────────────────────────────────────────────────

message StreamChatRequest {
  string thread_id = 1;  // vazio = cria thread nova
  string content   = 2;  // mensagem do usuário
  ChatConfig config = 3;
}

message ChatConfig {
  string model           = 1;
  string llm_provider    = 2;
  int32  recursion_limit = 3;
  string workspace_id    = 4;
}

message ResumeChatRequest {
  string thread_id    = 1;
  string interrupt_id = 2;
  string decision     = 3;  // "approve" | "reject" | "edit:<args_json>"
}

message GetToolsRequest {}

// ── Eventos de streaming ──────────────────────────────────────────────────

message StreamChatEvent {
  oneof event {
    ThreadEvent     thread      = 1;  // thread_id criado (1º evento)
    TokenEvent      token       = 2;  // chunk de texto do LLM
    ToolCallEvent   tool_call   = 3;  // tool foi invocada
    ToolResultEvent tool_result = 4;  // resultado da tool
    NodeEvent       node        = 5;  // nó do grafo iniciou/terminou
    UIMetricsEvent  ui_metrics  = 6;  // métricas em tempo real
    HITLEvent       hitl        = 7;  // pausa aguardando aprovação humana
    ErrorEvent      error       = 8;
    DoneEvent       done        = 9;
  }
}

message ThreadEvent     { string thread_id = 1; }
message TokenEvent      { string content = 1; string node = 2; }
message ToolCallEvent   {
  string tool_name    = 1;
  string tool_call_id = 2;
  string args_json    = 3;
  string render_hint  = 4;  // "search_results" | "diff" | "terminal_output" | ...
}
message ToolResultEvent {
  string tool_call_id  = 1;
  string content_json  = 2;
  bool   is_error      = 3;
}
message NodeEvent {
  string node        = 1;
  string status      = 2;  // "started" | "finished"
  int64  duration_ms = 3;
}
message UIMetricsEvent {
  string last_node    = 1;
  int64  last_node_ms = 2;
  int64  rag_hits     = 3;
  int64  rag_misses   = 4;
  map<string, int64> tool_calls = 5;
}
message HITLEvent {
  string tool_name    = 1;
  string args_json    = 2;
  string interrupt_id = 3;
}
message ErrorEvent { string message = 1; string code = 2; }
message DoneEvent  { string thread_id = 1; string run_id = 2; }

// ── Thread management ─────────────────────────────────────────────────────

message Thread {
  string id         = 1;
  string created_at = 2;
  string updated_at = 3;
  string title      = 4;
}

message HistoryMessage {
  string role       = 1;
  string content    = 2;
  string created_at = 3;
}

message CreateThreadRequest  {}
message GetThreadRequest     { string thread_id = 1; }
message ListThreadsRequest   { int32 limit = 1; }
message ListThreadsResponse  { repeated Thread threads = 1; }
message DeleteThreadRequest  { string thread_id = 1; }
message DeleteThreadResponse {}
message GetHistoryRequest    { string thread_id = 1; }
message GetHistoryResponse   { repeated HistoryMessage messages = 1; }

// ── Tools schema ──────────────────────────────────────────────────────────

message GetToolsResponse { repeated ToolSchema tools = 1; }
message ToolSchema {
  string name              = 1;
  string description       = 2;
  string render_hint       = 3;
  string args_schema_json  = 4;
}

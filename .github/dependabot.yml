version: 2

# Monorepo: o backend Python vive em /vectora; os projetos JS (company, docs,
# update-server, e o frontend do app — Electron fundido no mesmo
# package.json, sem pacote próprio) têm seus próprios package.json.
updates:
  # ── Python (uv.lock do app) ──────────────────────────────────────────────
  - package-ecosystem: "uv"
    directory: "/vectora"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers: ["brunosrz"]
    assignees: ["brunosrz"]
    commit-message:
      prefix: "📦 deps(vectora)"
      include: "scope"
    allow:
      - dependency-type: "direct"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # ── Python — segurança (direct + indirect, diário) ──────────────────────
  - package-ecosystem: "uv"
    directory: "/vectora"
    schedule:
      interval: "daily"
      time: "08:00"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    reviewers: ["brunosrz"]
    assignees: ["brunosrz"]
    commit-message:
      prefix: "🔒 security(vectora)"
      include: "scope"

  # ── GitHub Actions (workflows + composite actions) ───────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers: ["brunosrz"]
    assignees: ["brunosrz"]
    commit-message:
      prefix: "🔐 ci"
      include: "scope"

  # ── npm — um por projeto JS (agrupado p/ reduzir ruído de PR) ────────────
  - package-ecosystem: "npm"
    directory: "/company"
    schedule: { interval: "weekly", day: "monday", time: "09:00" }
    open-pull-requests-limit: 5
    reviewers: ["brunosrz"]
    commit-message: { prefix: "📦 deps(company)", include: "scope" }
    groups:
      company-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule: { interval: "weekly", day: "monday", time: "09:00" }
    open-pull-requests-limit: 5
    reviewers: ["brunosrz"]
    commit-message: { prefix: "📦 deps(docs)", include: "scope" }
    groups:
      docs-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/update-server"
    schedule: { interval: "weekly", day: "monday", time: "09:00" }
    open-pull-requests-limit: 5
    reviewers: ["brunosrz"]
    commit-message: { prefix: "📦 deps(update-server)", include: "scope" }
    groups:
      update-server-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/vectora/frontend"
    schedule: { interval: "weekly", day: "monday", time: "09:00" }
    open-pull-requests-limit: 5
    reviewers: ["brunosrz"]
    commit-message: { prefix: "📦 deps(frontend)", include: "scope" }
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

name: Bug Report
description: Something isn't working correctly
labels: ["bug", "needs-triage"]
assignees: ["brunosoares"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: Vectora version
      description: Output of `vectora --version`
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Ubuntu 22.04+
        - Debian 12+
        - macOS (Docker Desktop)
        - Other Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear description of what's happening
      placeholder: "When I do X, Y happens instead of Z"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `vectora setup`
        2. Open chat
        3. Type "..."
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste relevant logs (use `vectora --log-level debug`)
      render: shell

  - type: dropdown
    id: plan
    attributes:
      label: Plan
      options:
        - Trial
        - Plus
        - Pro
    validations:
      required: true

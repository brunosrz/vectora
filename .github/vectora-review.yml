# .github/vectora-review.yml — Configuração do Vectora Bot para este repositório.
# Seguro para commitar (nenhum segredo aqui — token/chaves de provider ficam
# no painel bot.vectora.company + GitHub Environment, nunca neste arquivo).
version: 1

# -----------------------------------------------------------------------------
# Revisão de Pull Requests
# -----------------------------------------------------------------------------
review:
  enabled: true

  # "on_open"    — revisa automaticamente todo PR aberto/atualizado.
  # "on_request" — só revisa quando pedido (comentário "@vectora review" ou
  #                a label abaixo). Default em repo privado: on_request, pra
  #                não gastar crédito do provider em todo PR/rascunho sem pedir.
  #                Default em repo público: on_open (com atraso, ver abaixo).
  trigger: on_request

  # Label que também dispara a revisão (alternativa ao comentário).
  trigger_label: vectora

  # Só usado com trigger: on_open, em repo público — espera N minutos antes
  # de comentar, pra dar tempo de outros bots (GitHub Copilot, Codex, Claude
  # Code) comentarem primeiro. Evita review redundante/corrida no mesmo PR.
  # defer_to_other_bots_minutes: 5

  # Glob de arquivos que o bot nunca comenta sobre.
  # ignore_paths:
  #   - "**/*.lock"
  #   - "**/dist/**"
  #   - "**/generated/**"

  # "strict" | "balanced" | "lenient" — repassado ao prompt de review.
  style: balanced

# -----------------------------------------------------------------------------
# Correção de CI sob demanda (modelo codex-fix-ci.yml do lancedb-gatekeeper)
# -----------------------------------------------------------------------------
fix_ci:
  # Opt-in explícito — o bot escreve código sozinho e abre PR, mais arriscado
  # que só comentar. Desligado por padrão até vir de fora do MVP.
  enabled: false

  # Só reage a este comando, num comentário de PR ou issue.
  trigger_comment: "@vectora fix-ci"

  # Nunca mexe em arquivo de workflow (.github/workflows/**), a menos que a
  # própria falha de CI seja causada por ele — mesma guarda do
  # codex-fix-ci.yml original.
  allow_workflow_file_changes: false

  # Nunca força push nem commita direto na branch que falhou — sempre abre
  # um PR novo (branch "vectora/fix-ci-<run_id>") pro autor revisar e mergear.
  # target_branch: auto  # "auto" = a branch do PR/run que falhou

# -----------------------------------------------------------------------------
# Provider / modelo — opcional, sobrescreve só PARA ESTE REPOSITÓRIO o que
# está configurado no painel (bot.vectora.company). Nunca a chave em si.
# -----------------------------------------------------------------------------
# provider: anthropic
# model: claude-sonnet-5

name: Update Server (Cloudflare Worker)

# Servidor de updates (Hono em Cloudflare Workers). Gated por path: só roda
# quando update-server/** muda.
on:
  push:
    branches: ["**"]
    paths:
      - "update-server/**"
      - ".github/workflows/update-server.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "update-server/**"
      - ".github/workflows/update-server.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: update-server

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Verify (install + typecheck) ──────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: update-server/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check (se houver tsconfig)
        run: |
          if [ -f tsconfig.json ]; then
            pnpm exec tsc --noEmit
          else
            echo "Sem tsconfig.json — typecheck pulado (worker ainda em setup)."
          fi

  # ── 2. Deploy (Cloudflare Workers) ───────────────────────────────────────
  # Só em push para master e quando CLOUDFLARE_API_TOKEN está configurado.
  # Requer wrangler.toml no update-server/ (ver update-server/README.md).
  deploy:
    name: Deploy (wrangler)
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    environment:
      name: update-server-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: update-server/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy to Cloudflare
        # Só roda se o token estiver presente (worker pode ainda não estar
        # provisionado). Sem token, o job passa sem deployar.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: pnpm exec wrangler deploy

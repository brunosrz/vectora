name: CI

# GitHub Actions cobre só o app Vectora (backend Python + frontend + Electron).
# Deploy de company/docs/services é manual (Vercel/Wrangler CLI local) — não
# roda aqui. Release de versão (build matrix + publish no R2/KV) dispara por
# mensagem de commit contendo "[up-release]", não por tag — ver
# .github/workflows/vectora.yml (job release-native/publish-update-channel).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vectora:
    uses: ./.github/workflows/vectora.yml
    secrets: inherit

name: CI

# GitHub Actions cobre só o app Vectora (backend Python + frontend + Electron).
# Deploy de company/docs/services é manual (Vercel/Wrangler CLI local) — não
# roda aqui.
#
# Repo privado = plano billado (Free tem cota baixa de minutos) — rodar a
# suíte inteira (lint+testes+build+matrix de release) em TODO push não
# compensa quando a intenção não é publicar. Por isso o job só roda de
# verdade com "[up-release]" na mensagem do commit ou workflow_dispatch
# manual; qualquer outro push aparece como job "skipped" no Actions —
# skip acontece antes de alocar runner, então custa 0 minutos.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vectora:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[up-release]') }}
    uses: ./.github/workflows/vectora.yml
    secrets: inherit

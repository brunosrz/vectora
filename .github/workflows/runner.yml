name: Vectora CI/CD Pipeline

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: read
  checks: write
  statuses: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 3.13: versão que o projeto resolve via uv (cpython-3.13) e a única
  # oficialmente suportada pelo Nuitka 4.1.x. 3.14 só vira oficial no Nuitka 4.2.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  # Força TODAS as actions JS (checkout, setup-python, setup-uv…) a rodarem em
  # Node 24, nunca Node 20 (que o GitHub vai aposentar). Opt-in oficial.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 0. Detecção de mudanças — gate de paths para os jobs de sites ────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    outputs:
      company: ${{ steps.filter.outputs.company }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            company:
              - 'company/**'

  # ── Sites (company + docs) — verificação via workflow reutilizável ───────
  # Só roda quando company/** muda; a Vercel faz o deploy real no push.
  sites:
    name: Sites
    needs: changes
    if: ${{ needs.changes.outputs.company == 'true' }}
    uses: ./.github/workflows/sites.yml

  # ── 1. Lint & Format ────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ruff check
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests

  # ── 2. Security Scanning ────────────────────────────────────────────────
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bandit (static security analysis)
        run: uv run bandit -c pyproject.toml -r src || true
      - name: pip-audit (vulnerable dependencies)
        run: uv run --with pip-audit pip-audit || true

  # ── 3. Build Verification (backend compile + chat SPA) ──────────────────
  build_verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile backend
        run: uv run python -m compileall src
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Build chat SPA
        # cwd=chat (não `--dir chat`): o pnpm resolve onlyBuilt/ignoredBuiltDependencies
        # a partir do cwd; de fora de chat/ ele não lê o pnpm-workspace.yaml e o
        # install aborta com ERR_PNPM_IGNORED_BUILDS (sharp).
        working-directory: chat
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  # ── 4a. Unit Tests ──────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build_verification
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create .env from Secrets
        run: |
          cat <<'EOF' > .env
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY || 'test-key' }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY || 'test-key' }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY || 'test-key' }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'google-genai' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          ENABLE_WEB_SEARCH=false
          ENABLE_WEB_FETCH=false
          EOF
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=src --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
        continue-on-error: true

  # ── 4b. Stress Tests ────────────────────────────────────────────────────
  test-stress:
    name: Stress Tests
    runs-on: ubuntu-latest
    needs: build_verification
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run stress tests
        run: uv run pytest tests/stress/ -v --timeout=120 --tb=short

  # ── 4c. Integration + E2E (gate do Docker; precisam de chaves reais) ────
  test-external:
    name: Integration + E2E Tests
    runs-on: ubuntu-latest
    needs: build_verification
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create .env from Secrets
        run: |
          cat <<'EOF' > .env
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY || '' }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY || '' }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY || '' }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'google-genai' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          ENABLE_WEB_SEARCH=true
          ENABLE_WEB_FETCH=true
          EOF
      - name: Integration tests
        run: uv run pytest tests/integration/ -v --timeout=120 -p no:randomly --tb=short
      - name: E2E tests
        run: uv run pytest tests/e2e/ -v --timeout=180 --tb=short

  # ── 5. Docker Build & Push (imagem + docker-compose disponíveis) ────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-unit, test-stress, test-external]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Extract version from pyproject.toml
        id: version
        run: echo "version=$(grep '^version = ' pyproject.toml | sed 's/version = \"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Publica em push para master e em tags v*; PRs só fazem build de verificação.
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 6. Release Native Binaries (Nuitka onefile + Electron installers) ───
  # Roda em TODO push (qualquer branch) + tags + dispatch — SEMPRE gera os
  # instaladores como artifacts, independente de tag v*. PRs ficam de fora (o
  # push do branch já cobre). A PUBLICAÇÃO nas releases privadas só ocorre em
  # tags v* (--publish always); fora de tag, apenas builda + sobe o artifact.
  release-native:
    name: Release native (${{ matrix.target }}/${{ matrix.arch }})
    needs: docker-build
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: linux
          - os: macos-latest
            arch: arm64
            target: mac
          - os: macos-13
            arch: x64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          all-extras: "false"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Build chat SPA (Vite)
        working-directory: chat
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build Nuitka onefile
        run: >-
          uv run python -m nuitka
          --mode=onefile
          --include-data-dir=chat/dist=chat_static
          --jobs=4
          --output-filename=vectora
          --output-dir=dist-nuitka
          --nofollow-import-to=mypy --nofollow-import-to=pytest
          --nofollow-import-to=coverage --nofollow-import-to=bandit
          --nofollow-import-to=ty --nofollow-import-to=ruff
          --nofollow-import-to=pyright --nofollow-import-to=IPython
          src/launcher.py
        shell: bash
      - name: Smoke test (license bypass)
        env:
          VECTORA_LICENSE_BYPASS: "1"
        run: ./dist-nuitka/vectora --version || ./dist-nuitka/vectora.exe --version
        shell: bash
      - name: Build desktop shell + installer
        env:
          CSC_LINK: ${{ secrets.WIN_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.VECTORA_RELEASES_TOKEN }}
        run: |
          pnpm --dir desktop install --frozen-lockfile
          pnpm --dir desktop build
          pnpm --dir desktop exec electron-builder --${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: vectora-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            desktop/dist-electron/*.exe
            desktop/dist-electron/*.msi
            desktop/dist-electron/*.dmg
            desktop/dist-electron/*.AppImage
            desktop/dist-electron/*.deb
            desktop/dist-electron/*.rpm
            desktop/dist-electron/latest*.yml
            desktop/dist-electron/*.blockmap
          if-no-files-found: warn
          retention-days: 30

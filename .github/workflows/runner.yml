name: Vectora CI/CD Pipeline

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  pull-requests: read
  checks: write
  statuses: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.14"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ---------------------------------------------------------------------------
# Reusable step fragments via defaults (env file criado em cada job que precise)
# ---------------------------------------------------------------------------

jobs:
  # ── 1. Setup & Cache ────────────────────────────────────────────────────
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Cache Python dependencies
        uses: actions/cache@v4
        id: cache-venv
        continue-on-error: true
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

  # ── 2. Lint & Format ────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: setup
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Restore Python dependencies cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Run Ruff check
        run: uv run ruff check vectora tests

  # ── 3. Build Verification ───────────────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Restore Python dependencies cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Compile structure
        run: uv run python -m compileall vectora

  # ── 4a. Unit Tests ──────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Restore Python dependencies cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Create .env from Secrets
        run: |
          cat <<'EOF' > .env
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY || 'test-key' }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY || 'test-key' }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY || 'test-key' }}
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY || '' }}
          LANGSMITH_ENDPOINT=${{ secrets.LANGSMITH_ENDPOINT || '' }}
          LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT || '' }}
          LANGSMITH_TRACING=${{ secrets.LANGSMITH_TRACING || 'false' }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'google-genai' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          ENABLE_WEB_SEARCH=false
          ENABLE_WEB_FETCH=false
          EOF

      - name: Run unit tests
        run: |
          uv run pytest tests/unit/ \
            -v --cov=vectora --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml

  # ── 4b. Stress Tests ────────────────────────────────────────────────────
  test-stress:
    name: Stress Tests
    runs-on: ubuntu-latest
    needs: build
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Restore Python dependencies cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Run stress tests
        run: |
          uv run pytest tests/stress/ \
            -v --timeout=120 \
            --tb=short

  # ── 4c. Integration Tests ───────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Restore Python dependencies cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Create .env from Secrets
        run: |
          cat <<'EOF' > .env
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY || '' }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY || '' }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY || '' }}
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY || '' }}
          LANGSMITH_ENDPOINT=${{ secrets.LANGSMITH_ENDPOINT || '' }}
          LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT || '' }}
          LANGSMITH_TRACING=${{ secrets.LANGSMITH_TRACING || 'false' }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'google-genai' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          ENABLE_WEB_SEARCH=true
          ENABLE_WEB_FETCH=true
          EOF

      - name: Run integration tests
        # Requer GOOGLE_API_KEY + COHERE_API_KEY reais — pula se não disponíveis
        run: |
          uv run pytest tests/integration/ \
            -v --timeout=120 \
            -p no:randomly \
            --tb=short
        continue-on-error: ${{ secrets.GOOGLE_API_KEY == '' }}

  # ── 4c. E2E Tests ───────────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Restore Python dependencies cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Create .env from Secrets
        run: |
          cat <<'EOF' > .env
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY || '' }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY || '' }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY || '' }}
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY || '' }}
          LANGSMITH_ENDPOINT=${{ secrets.LANGSMITH_ENDPOINT || '' }}
          LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT || '' }}
          LANGSMITH_TRACING=${{ secrets.LANGSMITH_TRACING || 'false' }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'google-genai' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          ENABLE_WEB_SEARCH=true
          ENABLE_WEB_FETCH=true
          EOF

      - name: Run E2E tests
        # Requer Gemini CLI instalado e ~/.gemini/settings.json configurado
        # Não bloqueia o pipeline caso o ambiente não tenha o CLI
        run: |
          uv run pytest tests/e2e/ \
            -v --timeout=180 \
            --tb=short || true

  # ── 5. Security Scanning ────────────────────────────────────────────────
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: setup
    environment: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Restore Python dependencies cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Check for vulnerable dependencies
        run: |
          uv run pip install safety 2>/dev/null || echo "safety not available"
          safety check --json || true

  # ── 6. Docker Build & Push ──────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-unit, test-stress, test-integration, test-e2e, security]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/master' &&
       (contains(github.event.head_commit.message, '[deploy]') ||
        contains(toJSON(github.event.commits), '[deploy]') ||
        github.event_name == 'workflow_dispatch'))
    environment: Production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}

  # ── 7. Deploy to VPS ────────────────────────────────────────────────────
  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-build
    if: needs.docker-build.result == 'success'
    environment:
      name: Production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # 1. Garante diretório e envia docker-compose.yml via scp
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT $VPS_USER@$VPS_HOST "mkdir -p /$DEPLOY_PATH"
          scp -i ~/.ssh/deploy_key -P $VPS_PORT docker-compose.yml \
            $VPS_USER@$VPS_HOST:/$DEPLOY_PATH/docker-compose.yml

          # 2. Executa deploy no VPS
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT $VPS_USER@$VPS_HOST << ENDDEPLOY
          set -e
          echo "$GHCR_TOKEN" | docker login ghcr.io -u $GHCR_USER --password-stdin
          docker pull $IMAGE:latest
          cd /$DEPLOY_PATH
          docker compose down || true
          docker compose up -d
          echo "✅ Deploy concluído"
          docker compose ps
          ENDDEPLOY

      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key -p $VPS_PORT $VPS_USER@$VPS_HOST \
            "docker compose -f /$DEPLOY_PATH/docker-compose.yml ps"

  # ── 8. Publish to PyPI ──────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: docker-build
    # Roda apenas em tags v* (releases oficiais)
    if: |
      needs.docker-build.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    environment: Production
    permissions:
      contents: read
      id-token: write # Trusted Publishing OIDC — sem token necessário
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true

      - name: Restore Python dependencies cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Build wheel and sdist
        run: uv build

      - name: Verify wheel contains defaults.env
        run: |
          uv run python -c "
          import zipfile, sys
          from pathlib import Path
          wheels = list(Path('dist').glob('*.whl'))
          if not wheels:
              print('ERROR: no wheel found', file=sys.stderr); sys.exit(1)
          with zipfile.ZipFile(wheels[0]) as zf:
              found = any('defaults.env' in n for n in zf.namelist())
          if found:
              print(f'✔ defaults.env found in {wheels[0].name}')
          else:
              print('ERROR: defaults.env NOT in wheel!', file=sys.stderr); sys.exit(1)
          "

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

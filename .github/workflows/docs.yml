name: Docs (docs.vectora.company)

# Site de documentação (Docusaurus) → deploy na Vercel em docs.vectora.company.
# Reusable: disparado só pelo runner ci.yml, que faz o path-gating (docs/**).
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: docs

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Typecheck & Build ─────────────────────────────────────────────────
  verify:
    name: Typecheck / Build
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Build (Docusaurus)
        run: pnpm run build

  # ── 2. Deploy to Vercel (docs.vectora.company) ───────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    environment:
      name: docs-production
      url: https://docs.vectora.company
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Pull Vercel env
        run: npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build (Vercel prebuilt)
        run: npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy (prebuilt)
        run: npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

name: Docs (docs.vectora.company)

# Site de documentação (Hugo + Hextra) → deploy na Vercel em docs.vectora.company.
# Reusable: disparado só pelo runner ci.yml, que faz o path-gating (docs/**).
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: docs

env:
  HUGO_VERSION: "0.163.3"
  NODE_VERSION: "24"

jobs:
  # ── 1. Build check ───────────────────────────────────────────────────────
  verify:
    name: Build (Hugo)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v5
      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      # Módulo Hextra vendorizado em docs/_vendor/ — build não precisa de rede
      # nem do toolchain Go. Não rodar `hugo mod get` aqui, que faz upgrade do
      # pin em go.mod como side-effect.
      - name: Build
        run: hugo --gc --minify

  # ── 2. Deploy to Vercel (docs.vectora.company) ───────────────────────────
  # ci.yml só dispara via workflow_dispatch (Jenkins assume o CI contínuo) —
  # o disparo aqui é sempre manual; a checagem é só a branch, não o evento.
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.ref == 'refs/heads/master' }}
    environment:
      name: docs-production
      url: https://docs.vectora.company
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Steps de deploy só rodam com o token presente — sem o secret VERCEL_TOKEN
      # o job passa (verde) sem deployar, em vez de quebrar com "--token vazio".
      # O build em si (Vercel prebuilt) roda Hugo internamente via HUGO_VERSION
      # + buildCommand declarados em docs/vercel.json — nada de Node/pnpm aqui.
      - name: Pull Vercel env
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build (Vercel prebuilt)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy (prebuilt)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

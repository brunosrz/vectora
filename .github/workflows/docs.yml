name: Docs (docs.vectora.company)

# Site de documentação (Docusaurus) → deploy na Vercel em docs.vectora.company.
# Reusable: disparado só pelo runner ci.yml, que faz o path-gating (docs/**).
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: docs

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.0"

jobs:
  # ── 1. Typecheck & Build ─────────────────────────────────────────────────
  verify:
    name: Typecheck / Build
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Build (Docusaurus)
        run: pnpm run build

  # ── 2. Deploy to Vercel (docs.vectora.company) ───────────────────────────
  # ci.yml só dispara via workflow_dispatch (Jenkins assume o CI contínuo) —
  # o disparo aqui é sempre manual; a checagem é só a branch, não o evento.
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.ref == 'refs/heads/master' }}
    environment:
      name: docs-production
      url: https://docs.vectora.company
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DOCS }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      # Steps de deploy só rodam com o token presente — sem o secret VERCEL_TOKEN
      # o job passa (verde) sem deployar, em vez de quebrar com "--token vazio".
      - name: Pull Vercel env
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build (Vercel prebuilt)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy (prebuilt)
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

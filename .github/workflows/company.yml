name: Company (vectora.company)

# Site institucional (TanStack Start + Vite) → deploy na Vercel em vectora.company.
# Gated por path: só roda quando company/** muda.
on:
  push:
    branches: ["**"]
    paths:
      - "company/**"
      - ".github/workflows/company.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "company/**"
      - ".github/workflows/company.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: company

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Lint, Typecheck & Test ────────────────────────────────────────────
  verify:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: company/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Paraglide i18n types
        run: node node_modules/@inlang/paraglide-js/bin/run.js compile --project ./project.inlang --outdir ./src/paraglide
      - name: Generate router types
        run: pnpm run generate-routes
      - name: Prettier check
        run: pnpm run check
      - name: ESLint
        run: pnpm run lint
      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Unit tests
        run: pnpm run test

  # ── 2. Deploy to Vercel (vectora.company) ────────────────────────────────
  # Só em push para master (não em PR). A Vercel buildam via vercel.json
  # (buildCommand/installCommand); aqui controlamos QUANDO deployar (por path).
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    environment:
      name: company-production
      url: https://vectora.company
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_COMPANY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: company/pnpm-lock.yaml
      - name: Pull Vercel env
        run: npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build (Vercel prebuilt)
        run: npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy (prebuilt)
        run: npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

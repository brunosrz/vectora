name: Vectora (app)

# Pipeline do app Vectora (backend Python + frontend Vite + casca Electron).
# Reusable: disparado só pelo runner ci.yml (que faz o path-gating). O job
# release-native continua gated a tags v* / workflow_dispatch internamente.
on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: vectora

env:
  # 3.13: versão que o uv resolve (cpython-3.13) e a única suportada pelo
  # Nuitka 4.1.x. 3.14 só vira oficial no Nuitka 4.2.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  # ── 1. Lint & Format ────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ruff check
        run: uv run ruff check backend tests
      - name: Ruff format check
        run: uv run ruff format --check backend tests
      - name: Type check (ty)
        run: uv run ty check backend tests

  # ── 2. Security Scanning ────────────────────────────────────────────────
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bandit (static security analysis)
        run: uv run bandit -c pyproject.toml -r backend || true
      - name: pip-audit (vulnerable dependencies)
        run: uv run --with pip-audit pip-audit || true

  # ── 2b. Frontend (oxlint + tsc + vitest) ────────────────────────────────
  # O job `lint` cobre só o Python (ruff + ty). A suíte TypeScript — lint
  # (oxlint), type check (tsc --noEmit) e testes (vitest) — roda aqui. i18n e
  # rotas (Paraglide + TanStack Router) são gerados antes; ambos são pré-req do
  # tsc e do vitest.
  frontend:
    name: Frontend (lint + types + tests)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - name: Install deps
        working-directory: vectora/frontend
        run: pnpm install --frozen-lockfile
      - name: Compile i18n messages (Paraglide)
        working-directory: vectora/frontend
        run: pnpm i18n:compile
      - name: Lint (oxlint)
        working-directory: vectora/frontend
        run: pnpm exec oxlint
      - name: Type check (tsc --noEmit)
        working-directory: vectora/frontend
        run: pnpm typecheck
      - name: Unit tests (vitest)
        working-directory: vectora/frontend
        run: pnpm test

  # ── 3. Build Verification (backend compile + frontend SPA) ──────────────
  build_verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, security, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile backend
        run: uv run python -m compileall backend
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - name: Build frontend SPA
        # cwd=vectora/frontend (não `--dir`): o pnpm resolve allowBuilds (sharp)
        # a partir do cwd; de fora de frontend/ ele não lê o pnpm-workspace.yaml
        # e o install aborta com ERR_PNPM_IGNORED_BUILDS.
        working-directory: vectora/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  # ── 4a. Unit Tests ──────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build_verification
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create .env from Secrets
        run: |
          cat <<'EOF' > .env
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY || 'test-key' }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY || 'test-key' }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY || 'test-key' }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'google-genai' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          ENABLE_WEB_SEARCH=false
          ENABLE_WEB_FETCH=false
          EOF
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=backend --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: vectora/coverage.xml
        continue-on-error: true

  # ── 4b. Stress Tests ────────────────────────────────────────────────────
  test-stress:
    name: Stress Tests
    runs-on: ubuntu-latest
    needs: build_verification
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run stress tests
        run: uv run pytest tests/stress/ -v --timeout=120 --tb=short

  # ── 4c. Integration + E2E (gate do Docker; precisam de chaves reais) ────
  test-external:
    name: Integration + E2E Tests
    runs-on: ubuntu-latest
    needs: build_verification
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create .env from Secrets
        run: |
          cat <<'EOF' > .env
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY || '' }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY || '' }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY || '' }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'google-genai' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          ENABLE_WEB_SEARCH=true
          ENABLE_WEB_FETCH=true
          EOF
      - name: Integration tests
        run: uv run pytest tests/integration/ -v --timeout=120 -p no:randomly --tb=short
      - name: E2E tests
        run: uv run pytest tests/e2e/ -v --timeout=180 --tb=short

  # ── 5. Release Native Binaries (Nuitka onefile + Electron installers) ───
  # Matriz cara: 4 SOs, incluindo macOS (multiplicador 10x de minutos) e
  # Windows (2x). Por isso roda SÓ em tags v* (release) ou disparo manual
  # (workflow_dispatch) — não em todo push, que estouraria a cota de Actions.
  # A PUBLICAÇÃO nas releases privadas só ocorre em tags v* (--publish always).
  release-native:
    name: Release native (${{ matrix.target }}/${{ matrix.arch }})
    needs: [test-unit, test-stress, test-external]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: linux
          - os: macos-latest
            arch: arm64
            target: mac
          - os: macos-13
            arch: x64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          all-extras: "false"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - name: Build frontend SPA (Vite)
        working-directory: vectora/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build Nuitka onefile
        # Flags de build vivem nas diretivas `# nuitka-project:` em
        # backend/launcher.py (fonte única). Aqui só passamos --jobs.
        run: uv run python -m nuitka --jobs=4 backend/launcher.py
        shell: bash
      - name: Smoke test (license bypass)
        env:
          VECTORA_LICENSE_BYPASS: "1"
        run: ./dist-nuitka/vectora --version || ./dist-nuitka/vectora.exe --version
        shell: bash
      - name: Build desktop shell + installer
        env:
          CSC_LINK: ${{ secrets.WIN_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.VECTORA_RELEASES_TOKEN }}
        run: |
          pnpm --dir electron install --frozen-lockfile
          pnpm --dir electron build
          pnpm --dir electron exec electron-builder --${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: vectora-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            vectora/electron/dist-electron/*.exe
            vectora/electron/dist-electron/*.msi
            vectora/electron/dist-electron/*.dmg
            vectora/electron/dist-electron/*.AppImage
            vectora/electron/dist-electron/*.deb
            vectora/electron/dist-electron/*.rpm
            vectora/electron/dist-electron/latest*.yml
            vectora/electron/dist-electron/*.blockmap
          if-no-files-found: warn
          retention-days: 30

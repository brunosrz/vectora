name: Vectora (app)

# Pipeline do app Vectora (backend Python + frontend Vite + casca Electron).
#
# Repo privado = plano billado (Free tem cota baixa de minutos) — rodar a
# suíte inteira (lint+testes+build+matriz de release) em todo push não
# compensa quando a intenção não é publicar. Por isso os jobs de entrada
# (lint/security/frontend) só rodam de verdade com "[up-release]" na
# mensagem do commit ou workflow_dispatch manual; qualquer outro push
# aparece como "skipped" no Actions — skip acontece antes de alocar
# runner, então custa 0 minutos. release-native (+ publish-update-channel)
# repete o mesmo gate internamente, não tags.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: vectora

env:
  # 3.13: versão que o uv resolve (cpython-3.13) e a única suportada pelo
  # Nuitka 4.1.x. 3.14 só vira oficial no Nuitka 4.2.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  # ── 1. Lint & Format ────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[up-release]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ruff check
        run: uv run ruff check backend tests
      - name: Ruff format check
        run: uv run ruff format --check backend tests
      - name: Type check (ty)
        run: uv run ty check backend tests

  # ── 2. Security Scanning ────────────────────────────────────────────────
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[up-release]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bandit (static security analysis)
        run: uv run bandit -c pyproject.toml -r backend || true
      - name: pip-audit (vulnerable dependencies)
        run: uv run --with pip-audit pip-audit || true

  # ── 2b. Frontend (oxlint + tsc + vitest) ────────────────────────────────
  # O job `lint` cobre só o Python (ruff + ty). A suíte TypeScript — lint
  # (oxlint), type check (tsc --noEmit) e testes (vitest) — roda aqui. i18n e
  # rotas (Paraglide + TanStack Router) são gerados antes; ambos são pré-req do
  # tsc e do vitest.
  frontend:
    name: Frontend (lint + types + tests)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[up-release]') }}
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - name: Install deps
        working-directory: vectora/frontend
        run: pnpm install --frozen-lockfile
      - name: Compile i18n messages (Paraglide)
        working-directory: vectora/frontend
        run: pnpm i18n:compile
      - name: Lint (oxlint)
        working-directory: vectora/frontend
        run: pnpm exec oxlint
      - name: Type check (tsc --noEmit)
        working-directory: vectora/frontend
        run: pnpm typecheck
      - name: Unit tests (vitest)
        working-directory: vectora/frontend
        run: pnpm test

  # ── 3. Build Verification (backend compile + frontend SPA) ──────────────
  build_verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, security, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile backend
        run: uv run python -m compileall backend
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - name: Build frontend SPA
        # cwd=vectora/frontend (não `--dir`): o pnpm resolve allowBuilds (sharp)
        # a partir do cwd; de fora de frontend/ ele não lê o pnpm-workspace.yaml
        # e o install aborta com ERR_PNPM_IGNORED_BUILDS.
        working-directory: vectora/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  # ── 4a. Unit Tests ──────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build_verification
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create .env from Secrets
        run: |
          cat <<'EOF' > .env
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY || 'test-key' }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY || 'test-key' }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY || 'test-key' }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'google-genai' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          ENABLE_WEB_SEARCH=false
          ENABLE_WEB_FETCH=false
          EOF
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=backend --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: vectora/coverage.xml
        continue-on-error: true

  # ── 4b. Stress Tests ────────────────────────────────────────────────────
  test-stress:
    name: Stress Tests
    runs-on: ubuntu-latest
    needs: build_verification
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run stress tests
        run: uv run pytest tests/stress/ -v --timeout=120 --tb=short

  # ── 4c. Integration + E2E (gate do Docker; precisam de chaves reais) ────
  test-external:
    name: Integration + E2E Tests
    runs-on: ubuntu-latest
    needs: build_verification
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Create .env from Secrets
        run: |
          cat <<'EOF' > .env
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY || '' }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY || '' }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY || '' }}
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'google-genai' }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL || 'INFO' }}
          ENABLE_WEB_SEARCH=true
          ENABLE_WEB_FETCH=true
          EOF
      - name: Integration tests
        run: uv run pytest tests/integration/ -v --timeout=120 -p no:randomly --tb=short
      - name: E2E tests
        run: uv run pytest tests/e2e/ -v --timeout=180 --tb=short

  # ── 5. Release Native Binaries (Nuitka onefile + Electron installers) ───
  # Matriz cara: 4 SOs, incluindo macOS (multiplicador 10x de minutos) e
  # Windows (2x). Por isso roda SÓ com "[up-release]" na mensagem do commit
  # (mesmo marcador que `scons up-release` usa) ou disparo manual
  # (workflow_dispatch) — não em todo push, que estouraria a cota de Actions.
  # O gatilho é a mensagem do commit, viajando junto do push normal — não
  # depende de uma tag separada. A PUBLICAÇÃO da GitHub Release (--publish
  # always) e a publicação no canal de update (R2/KV, job
  # publish-update-channel abaixo) só ocorrem com "[up-release]" — nunca em
  # workflow_dispatch manual (que é só pra validar que a matriz builda).
  release-native:
    name: Release native (${{ matrix.target }}/${{ matrix.arch }})
    needs: [test-unit, test-stress, test-external]
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[up-release]') }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            target: linux
          - os: macos-latest
            arch: arm64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          all-extras: "false"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - name: Build frontend SPA (Vite)
        working-directory: vectora/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install ccache
        # Nuitka já avisa nos logs "You are not using ccache" — sem ele,
        # cada run recompila os ~230 arquivos C do backend do zero (a
        # etapa mais lenta da matriz, 10-20min). Instala o binário aqui;
        # o cache do diretório em si é o próximo step.
        shell: bash
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get update -qq && sudo apt-get install -y ccache ;;
            macOS) brew install ccache ;;
            Windows) choco install ccache -y ;;
          esac
      - name: Cache ccache (Nuitka C compilation)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          # Chave por SO/arch + hash do backend: cache miss só quando o
          # backend muda de verdade; restore-keys garante reuso parcial
          # (objetos não afetados pela mudança) mesmo em cache miss.
          key: ccache-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('vectora/backend/**') }}
          restore-keys: |
            ccache-${{ matrix.target }}-${{ matrix.arch }}-
      - name: Build hybrid (Nuitka backend.pyd + PyInstaller onedir)
        # Mesmo pipeline que `scons release` roda localmente
        # (build-hybrid.py, na raiz do monorepo — não em vectora/): Nuitka
        # --mode=package compila só o pacote backend pra backend.pyd, depois
        # PyInstaller empacota launcher.py + backend.pyd + libs em
        # dist/vectora/ (onedir). working-directory sobrescreve o default
        # do job (que é "vectora") porque o script fica um nível acima.
        working-directory: .
        # build-hybrid.py espera "--jobs N" como dois argv separados
        # (sys.argv.index("--jobs")+1) — "--jobs=4" não bate no parser.
        run: python build-hybrid.py --jobs 4
        shell: bash
      - name: Smoke test (license bypass)
        env:
          VECTORA_LICENSE_BYPASS: "1"
        working-directory: .
        run: ./dist/vectora/vectora --version || ./dist/vectora/vectora.exe --version
        shell: bash
      - name: Export Windows signing cert
        # electron-builder só pula a assinatura quando CSC_LINK está
        # ausente (undefined) — setado como string vazia ainda conta
        # como "certificado fornecido" e quebra o keychain no mac/linux.
        # $GITHUB_ENV só é escrito neste step (matrix.target == 'win'),
        # deixando a var genuinamente ausente nos outros SOs.
        if: matrix.target == 'win'
        shell: bash
        run: |
          echo "CSC_LINK=${{ secrets.WIN_CERTIFICATE_BASE64 }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build desktop shell + installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.VECTORA_RELEASES_TOKEN }}
        run: |
          pnpm --dir electron install --frozen-lockfile
          pnpm --dir electron build
          pnpm --dir electron exec electron-builder --${{ matrix.target }} --publish ${{ contains(github.event.head_commit.message, '[up-release]') && 'always' || 'never' }}
      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: vectora-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            vectora/electron/dist-electron/*.exe
            vectora/electron/dist-electron/*.msi
            vectora/electron/dist-electron/*.dmg
            vectora/electron/dist-electron/*.AppImage
            vectora/electron/dist-electron/*.deb
            vectora/electron/dist-electron/*.rpm
            vectora/electron/dist-electron/latest*.yml
            vectora/electron/dist-electron/*.blockmap
          if-no-files-found: warn
          retention-days: 30

  # ── 6. Publish to update channel (R2 + KV) ───────────────────────────────
  # Roda só com "[up-release]" na mensagem do commit (nunca em
  # workflow_dispatch manual, que é só pra validar a matriz) e uma única vez,
  # depois que TODA a matriz terminou — publicar de dentro de cada job da
  # matriz faria 4 read-modify-write concorrentes na mesma chave `config` do
  # KV (services/scripts/release.ts::putChannelVersion), corrompendo o
  # rollout_percent/previous_stable por race condition.
  publish-update-channel:
    name: Publish to update channel (R2 + KV)
    needs: release-native
    if: ${{ contains(github.event.head_commit.message, '[up-release]') }}
    runs-on: ubuntu-latest
    environment:
      name: services-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - name: Read version from pyproject.toml
        # Fonte única do semver (mesmo arquivo que backend/version.py lê via
        # importlib.metadata) — sem tag pra extrair a versão, lemos direto.
        id: version
        run: |
          VERSION=$(grep -m1 '^version' vectora/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download all installers
        uses: actions/download-artifact@v6
        with:
          pattern: vectora-*
          path: dist-electron-all
          merge-multiple: true
      - name: Install services deps
        working-directory: services
        run: pnpm install --frozen-lockfile
      - name: Publish (R2 + KV)
        # Sem CLOUDFLARE_API_TOKEN o wrangler falha na autenticação — deixa o
        # job vermelho de propósito: publicar release é um "[up-release]"
        # deliberado, então falha visível é o comportamento certo se o
        # secret não estiver configurado (nunca um no-op silencioso aqui).
        working-directory: services
        run: |
          pnpm run release -- --version=${{ steps.version.outputs.value }} --dist="$GITHUB_WORKSPACE/dist-electron-all"

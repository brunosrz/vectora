default_language_version:
  python: python3

default_stages: [pre-commit]
minimum_pre_commit_version: 3.0.0

exclude: |
  (?x)^(
    \.git/.*|
    .*\.pdf$|
    .*\.lock$|
    package-lock\.json|
    yarn\.lock|
    coverage\..*|
    \.env.*|
    \.venv/.*|
     \.mjs.*
  )$

repos:
  # ==========================================
  # UV Lock Validation
  # ==========================================
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.16
    hooks:
      - id: uv-lock

  # ==========================================
  # Basic File Validation
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        name: Fix End of File
        stages: [pre-commit]
      - id: check-yaml
        name: Validate YAML
        args: ["--allow-multiple-documents", "--unsafe"]
        stages: [pre-commit]
      - id: check-json
        name: Validate JSON
        stages: [pre-commit]
      - id: check-toml
        name: Validate TOML
        stages: [pre-commit]
      - id: check-merge-conflict
        name: Check for Merge Conflicts
        stages: [pre-commit]
      - id: check-added-large-files
        name: Check for Large Files
        args: ["--maxkb=5000"]
        stages: [pre-commit]
      - id: detect-private-key
        name: Detect Private Keys
        stages: [pre-commit]

  # ==========================================
  # Python Syntax Check (stdlib compileall)
  # Roda antes do ruff — rejeita SyntaxErrors imediatamente.
  # ==========================================
  - repo: local
    hooks:
      - id: compileall
        name: Python Syntax (compileall)
        entry: uv run python -m compileall -q -j0
        language: system
        types: [python]

  # ==========================================
  # Python Validation
  # ==========================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        name: Ruff Lint (Python)
        args: [--fix, --select, I]
        files: \.py$
      - id: ruff-format
        name: Ruff Format (Python)
        files: \.py$

  # ==========================================
  # TypeScript / JavaScript Validation
  # ==========================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Prettier
        args: ["--write"]
        files: \.(ts|tsx|js|jsx|mjs|cjs|json)$
        types_or: [text]

  # ==========================================
  # Markdown & YAML Validation
  # ==========================================

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Prettier (markdown + yaml)
        args: ["--write"]
        files: \.(md|yaml|yml|css)$
        types_or: [text]

  # ==========================================
  # ==========================================
  # Security & Vulnerability Scans
  # ==========================================
  - repo: local
    hooks:
      - id: bandit
        name: Bandit Security Scan
        entry: uv run bandit -s B110,B101 -c pyproject.toml
        language: system
        types: [python]

  # ==========================================
  # Type Checking — Python (Astral `ty`, full repo)
  # ==========================================
  # Substitui o antigo Pyright limitado a 2 pastas. `ty` é um type checker
  # em Rust ~10x mais rápido que pyright/mypy e cobre tudo de uma vez.
  - repo: local
    hooks:
      - id: ty
        name: Type Check — Python (ty)
        entry: uv run ty check src tests
        language: system
        types: [python]
        pass_filenames: false

  # ==========================================
  # Type Checking — TypeScript (tsc)
  # ==========================================
  # `pnpm --dir chat exec tsc` é cross-platform (Windows/Linux/macOS) e
  # não depende de `bash` — sem dependência de WSL no Windows.
  - repo: local
    hooks:
      - id: tsc
        name: Type Check — TypeScript (tsc)
        entry: pnpm --dir chat exec tsc --noEmit -p tsconfig.json
        language: system
        files: ^chat/.*\.(ts|tsx)$
        pass_filenames: false

  # ==========================================
  # GitHub Actions Workflow Lint (actionlint)
  # ==========================================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        files: ^\.github/workflows/.*\.ya?ml$

ci:
  autofix_commit_msg: "chore: auto fixes from pre-commit hooks"
  autofix_prs: false
  autoupdate_branch: ""
  skip: []
  submodules: false

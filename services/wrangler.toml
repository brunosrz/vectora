name = "vectora-services"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

# relay/ (Fase A) — OAuth/webhooks pro app desktop, WebSocket bidirecional.
# Domínios relay.vectora.chat + {token}.vectora.chat continuam exatamente
# como estavam — o cliente Python do desktop já tem essas URLs hardcoded.
[durable_objects]
bindings = [
  { name = "RELAY_SESSION", class_name = "RelaySession" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelaySession"]

[[kv_namespaces]]
binding = "RELAY_METRICS"
id = "ae857e96bdf94823a10629562fb28184"

# updates/ (Fase A) — distribuição de releases (electron-updater + download
# público de primeira instalação). Domínio update.vectora.company.
[[r2_buckets]]
binding = "R2"
bucket_name = "vectora-releases"

[[kv_namespaces]]
binding = "KV"
id = "5bf302c7fcc9463aa642aa1731b13def"

# auth/billing/license/gdpr/api-keys/issues/rag-library (Fase B/C) — substitui
# o Postgres do Supabase. Sem RLS: autorização é feita em código, em cada
# handler (CLAUDE.md regra 7). Provisionar com `wrangler d1 create vectora-db`
# e colar o `database_id` gerado abaixo.
[[d1_databases]]
binding = "DB"
database_name = "vectora-db"
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"
migrations_dir = "migrations"

# GDPR hard-delete (soft-delete → 30 dias → apagado de vez). Roda 1x/dia.
[triggers]
crons = ["0 3 * * *"]

[vars]
MAX_PAYLOAD_BYTES = "5242880"
QUEUE_TTL_MS = "600000"
LICENSE_VALIDATE_URL = "https://vectora.company/functions/v1/validate-license"
APP_URL = "https://vectora.company"
RELAY_URL = "https://relay.vectora.chat"

# Secrets (não vão neste arquivo — `wrangler secret put <nome>`):
#   VECTORA_JWT_SECRET     — relay: verifica JWT assinado pelo backend Python
#   RELAY_HMAC_SECRET      — relay: assina o token de 6 chars por user+fingerprint
#   VECTORA_OAUTH_SECRET   — relay: Bearer auth nos endpoints /oauth/token
#   RESEND_API_KEY         — auth/billing/gdpr/issues: envio de email transacional
#   TURNSTILE_SECRET_KEY   — auth/issues: verificação anti-bot (opcional em dev)
#   STRIPE_SECRET_KEY      — billing: API Stripe (clientes INTL)
#   STRIPE_WEBHOOK_SECRET  — billing: valida assinatura do webhook Stripe
#   STRIPE_PRICE_PRO_USD   — billing: price id do plano Pro em USD
#   ASAAS_API_KEY          — billing: API Asaas (clientes BR)
#   ASAAS_API_URL          — billing: default https://api.asaas.com/v3

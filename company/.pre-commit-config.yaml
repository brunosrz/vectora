default_stages: [pre-commit]
minimum_pre_commit_version: 3.0.0

exclude: |
  (?x)^(
    \.git/.*|
    .*\.pdf$|
    .*\.lock$|
    package-lock\.json|
    yarn\.lock|
    coverage\..*|
    \.env.*|
    node_modules/.*|
    \.output/.*|
    dist/.*|
    \.venv/.*
  )$

repos:
  # ==========================================
  # Basic File Validation
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: detect-private-key

  # ==========================================
  # Prettier — format TS/TSX/JS/JSON/CSS/MD/YAML
  # Uses local prettier from node_modules to match pnpm exec prettier behavior
  # ==========================================
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: node node_modules/prettier/bin/prettier.cjs --write
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|css|md|yaml|yml)$
        types_or: [text]

  # ==========================================
  # Paraglide — generate i18n types before tsc
  # ==========================================
  - repo: local
    hooks:
      - id: paraglide-compile
        name: Generate Paraglide i18n types
        entry: node node_modules/@inlang/paraglide-js/bin/run.js compile --project ./project.inlang --outdir ./src/paraglide
        language: system
        pass_filenames: false
        always_run: true

  # ==========================================
  # TypeScript — tsc --noEmit
  # ==========================================
  - repo: local
    hooks:
      - id: tsc
        name: TypeScript (tsc --noEmit)
        entry: node node_modules/typescript/bin/tsc --noEmit
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # ==========================================
  # Oxlint — TypeScript 7-compatible lint
  # ==========================================
  - repo: local
    hooks:
      - id: oxlint
        name: Oxlint
        entry: pnpm exec oxlint
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false

  # ==========================================
  # GitHub Actions Workflow Lint (actionlint)
  # ==========================================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
        files: ^\.github/workflows/.*\.ya?ml$

ci:
  autofix_commit_msg: "chore: auto fixes from pre-commit hooks"
  autofix_prs: false
  autoupdate_branch: ""
  skip: []
  submodules: false

name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement", "needs-triage"]
assignees: ["brunosoares"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Vectora better? Describe it below.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What's your current workaround?
      placeholder: "I'm trying to do X but there's no way to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like to see
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat / LLM
        - RAG / Documents
        - Agents
        - MCP / Integrations
        - REST API / SDK
        - CLI
        - Dashboard / UI
        - Billing / Licensing
        - Self-hosting / Docker
        - Other
    validations:
      required: true

  - type: dropdown
    id: plan
    attributes:
      label: Your plan
      options:
        - Trial
        - Plus
        - Pro
    validations:
      required: true

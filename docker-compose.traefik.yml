name: vectora

# Deploy completo para VPS com Traefik + Let's Encrypt
#
# Pré-requisitos:
#   - VECTORA_DOMAIN e ACME_EMAIL definidos no .env
#
# Deploy:
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d

services:
  traefik:
    image: traefik:latest
    restart: unless-stopped
    network_mode: host
    command:
      - --api.dashboard=false
      - --api.insecure=false
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    volumes:
      - traefik-letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  vectora:
    # Remove a porta exposta — Traefik é o único ponto de entrada
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vectora.rule=Host(`${VECTORA_DOMAIN}`)"
      - "traefik.http.routers.vectora.entrypoints=websecure"
      - "traefik.http.routers.vectora.tls=true"
      - "traefik.http.routers.vectora.tls.certresolver=letsencrypt"
      - "traefik.http.services.vectora.loadbalancer.server.port=8000"

volumes:
  traefik-letsencrypt:

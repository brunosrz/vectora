name = "vectora-relay"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

[durable_objects]
bindings = [
  { name = "RELAY_SESSION", class_name = "RelaySession" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelaySession"]

[[kv_namespaces]]
binding = "RELAY_METRICS"
id = "ae857e96bdf94823a10629562fb28184"

[vars]
MAX_PAYLOAD_BYTES = "5242880"
QUEUE_TTL_MS = "600000"

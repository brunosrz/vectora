baseURL = 'https://docs.vectora.company/'
defaultContentLanguage = 'pt'
defaultContentLanguageInSubdir = true
title = 'Vectora Docs'
enableEmoji = false
disableKinds = ["taxonomy", "term"]

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[languages]
  [languages.pt]
    label = "Português"
    locale = "pt-BR"
    weight = 1
    title = "Vectora Docs"
    [languages.pt.params]
      description = "Vectora — agente de IA self-hosted com RAG híbrido, Context Graph nativo, servidor MCP sempre-ativo e chat web multi-usuário."
    [[languages.pt.menu.main]]
      name = "Docs"
      pageRef = "/docs"
      weight = 1
    [[languages.pt.menu.main]]
      identifier = "vectora.company"
      name = "vectora.company"
      url = "https://vectora.company"
      weight = 2
    [[languages.pt.menu.main]]
      identifier = "signup"
      name = "Começar trial grátis"
      url = "https://vectora.company/signup"
      weight = 3
      [languages.pt.menu.main.params]
        type = "button"
    [[languages.pt.menu.main]]
      identifier = "github"
      weight = 4
      url = "https://github.com/vectora-company/vectora"
      [languages.pt.menu.main.params]
        icon = "github"
    [[languages.pt.menu.main]]
      identifier = "search"
      weight = 5
      [languages.pt.menu.main.params]
        type = "search"
    [[languages.pt.menu.main]]
      identifier = "theme-toggle"
      weight = 6
      [languages.pt.menu.main.params]

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "img/vectora-logo.svg"
      link = "/"

  [params.page]
    width = "normal"
    [params.page.contextMenu]
      enable = true
      display = true

  [params.toc]
    displayToc = true

  [params.footer]
    displayCopyright = true
    displayPoweredBy = true

  [params.theme]
    default = 'dark'
    displayToggle = true

  favicon = "favicon-32x32.png"

  [params.author]
    name = 'Vectora'

  [params.opengraph]
    image = '/img/vectora-logo.svg'
    locale = 'pt_BR'

  [params.seo]
    keywords = 'Vectora, self-hosted AI agent, RAG, Context Graph, MCP, LangGraph, deep agent'
    robots = 'index, follow'

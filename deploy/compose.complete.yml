# Vectora — Stack completo (app + infra)
#
# Para produção em VPS sem Traefik.
# Para VPS com Traefik: use docker-compose.traefik.yml sobre este.
#
# Uso:
#   cp .env.example .env   # editar API keys e domínio
#   docker compose -f deploy/compose.complete.yml up -d

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Infra (mesmas imagens que compose.dev.yml)
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vectora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório em produção}
      POSTGRES_DB: ${POSTGRES_DB:-vectora}
    volumes:
      - vectora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vectora}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD obrigatório em produção}
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - vectora-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - vectora-qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Vectora app
  # ─────────────────────────────────────────────────────────────────────────────
  vectora:
    image: ghcr.io/brunosrz/vectora:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      # LLM providers
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - VECTORA_TOKEN=${VECTORA_TOKEN:-}
      # Storage (modo complete)
      - STORAGE_MODE=complete
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - POSTGRES_DSN=postgresql+asyncpg://${POSTGRES_USER:-vectora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vectora}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      # Runtime
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=${PORT:-8080}
    volumes:
      - vectora-data:/root/.vectora
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  vectora-postgres:
    driver: local
  vectora-redis:
    driver: local
  vectora-qdrant:
    driver: local
  vectora-data:
    driver: local

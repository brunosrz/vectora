# Vectora — Infraestrutura de desenvolvimento local
#
# Sobe Redis, PostgreSQL+pgvector e Qdrant para que o servidor Python
# possa rodar em modo `STORAGE_MODE=complete` enquanto você desenvolve.
#
# Uso:
#   docker compose -f deploy/compose.dev.yml up -d
#   docker compose -f deploy/compose.dev.yml down        # parar
#   docker compose -f deploy/compose.dev.yml down -v     # parar + apagar volumes
#
# Variáveis de ambiente consumidas pelo Vectora (adicionar ao .env):
#   STORAGE_MODE=complete
#   REDIS_URL=redis://:vectora@localhost:6379/0
#   POSTGRES_DSN=postgresql+asyncpg://vectora:vectora@localhost:5432/vectora
#   QDRANT_URL=http://localhost:6333
#   QDRANT_API_KEY=vectora
#
# Segurança (dev): todos os serviços exigem credencial (senha/API key) e as
# portas são publicadas APENAS em 127.0.0.1 — nada exposto para a LAN.

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 com extensão pgvector
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vectora
      POSTGRES_PASSWORD: vectora
      POSTGRES_DB: vectora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vectora-postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectora -d vectora"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis 7 — cache, rate-limit, pub/sub de invalidação
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass vectora
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - vectora-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vectora", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────────────────
  # Qdrant — vector store para RAG em modo complete
  # ─────────────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333" # REST API
      - "127.0.0.1:6334:6334" # gRPC
    volumes:
      - vectora-qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__API_KEY: vectora
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  vectora-postgres:
    driver: local
  vectora-redis:
    driver: local
  vectora-qdrant:
    driver: local
